# Docker Compose para Mini Gestor de Proyectos
# Arquitectura de Microservicios: Gateway Service + API Backend + PostgreSQL + Redis + LDAP
# Implementa el patrón Gatekeeper con servicios desacoplados

services:
  # ============================================================================
  # API GATEWAY SERVICE - Punto de entrada único (Puerto 8080)
  # ============================================================================
  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: mini-gestor-gateway
    restart: unless-stopped
    environment:
      # URL del backend (comunicación interna)
      BACKEND_URL: http://app:8000
      # URL del servicio de autenticación
      AUTH_SERVICE_URL: http://auth:8002
      # Redis para rate limiting y caché
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Configuración de seguridad
      SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      # Puerto EXTERNO del Gateway (único punto de entrada)
      - "8080:8080"
    networks:
      - mini-gestor-network

  # ============================================================================
  # BACKEND API SERVICE - Servicio interno (Puerto 8000 - solo red interna)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-gestor-app
    restart: unless-stopped
    environment:
      # Variables de entorno para conexión a DB
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-gestor_proyectos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gestor_proyectos}
      # Configuración de reintentos de conexión a la base de datos
      DB_MAX_RETRY_ATTEMPTS: ${DB_MAX_RETRY_ATTEMPTS:-5}
      DB_RETRY_MIN_WAIT: ${DB_RETRY_MIN_WAIT:-1}
      DB_RETRY_MAX_WAIT: ${DB_RETRY_MAX_WAIT:-10}
      # Configuración de Redis para caché
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_TTL: ${CACHE_TTL:-300}
      # Configuración de LDAP para Federated Identity
      LDAP_SERVER: ${LDAP_SERVER:-ldap://ldap:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=org}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-uid={username},ou=users,dc=example,dc=org}
      # Configuración de JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    # NOTA IMPORTANTE: Puerto 8000 NO expuesto externamente
    # Solo accesible desde la red interna (a través del Gateway)
    # Para desarrollo local directo, descomentar la siguiente línea:
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    networks:
      - mini-gestor-network
    volumes:
      # Montar código en desarrollo (opcional, remover en producción)
      - .:/app:ro

  # ============================================================================
  # AUTH SERVICE - Servicio de Autenticación (Puerto 8002 - solo red interna)
  # ============================================================================
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: mini-gestor-auth
    restart: unless-stopped
    environment:
      # Configuración de LDAP para Federated Identity
      LDAP_SERVER: ${LDAP_SERVER:-ldap://ldap:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=org}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-uid={username},ou=users,dc=example,dc=org}
      # Configuración de JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    # Puerto 8002 NO expuesto externamente - solo accesible internamente
    expose:
      - "8002"
    networks:
      - mini-gestor-network

  # ============================================================================
  # BASE DE DATOS POSTGRESQL
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: mini-gestor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gestor_proyectos}
    volumes:
      # Volumen persistente para datos de PostgreSQL
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización opcional
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - mini-gestor-network

  # ============================================================================
  # REDIS para caché (Cache-Aside Pattern) y rate limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: mini-gestor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mini-gestor-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # OPENLDAP para Federated Identity (Autenticación Externa)
  # ============================================================================
  ldap:
    image: osixia/openldap:1.5.0
    container_name: mini-gestor-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Example Organization"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin_password"
      LDAP_CONFIG_PASSWORD: "config_password"
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    ports:
      - "389:389"
      - "636:636"
    networks:
      - mini-gestor-network
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./init-ldap.ldif:/container/service/slapd/assets/test/init-ldap.ldif:ro
    command: --copy-service

  # ============================================================================
  # PHPLDAPADMIN para administración de LDAP (opcional)
  # ============================================================================
  ldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: mini-gestor-ldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8082:80"
    depends_on:
      - ldap
    networks:
      - mini-gestor-network

  # ============================================================================
  # ADMINER para administración de base de datos (opcional)
  # ============================================================================
  adminer:
    image: adminer:4-standalone
    container_name: mini-gestor-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - mini-gestor-network
    environment:
      ADMINER_DEFAULT_SERVER: db

# ==============================================================================
# VOLÚMENES para persistencia de datos
# ==============================================================================
volumes:
  postgres_data:
    driver: local
    name: mini-gestor-postgres-data
  redis_data:
    driver: local
    name: mini-gestor-redis-data
  ldap_data:
    driver: local
    name: mini-gestor-ldap-data
  ldap_config:
    driver: local
    name: mini-gestor-ldap-config

# ==============================================================================
# RED personalizada para comunicación entre servicios
# ==============================================================================
networks:
  mini-gestor-network:
    driver: bridge
    name: mini-gestor-network
